<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Trilha Verde</title>
    <link rel="stylesheet" href="style/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
            <!-- Lado esquerdo -->
        <section class="left">
        <div class="illustration">
            <img src="img/logo.png" alt="Logo Trilha Verde">
            <h2>Trilha Verde</h2>
            <p>Página de Administração</p>
        </div>
        </section>

        <!-- Lado direito -->
        <section class="right-singup">
            <h1 class="logo">Trilha Verde</h1>
            <h2>Crie uma nova conta</h2>

            <form class="form">
                <div class="profile-pic">
                    <img id="profileImage" src="img/avatar.png" alt="Foto de perfil">
                    <label for="fileInput" class="edit-icon">✏️</label>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                </div>


                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Nome completo">
                
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Seu e-mail">
                
                <label for="vinculo">Vínculo</label>
                <select name="vinculo" id="vinculo">
                    <option value="aluno">Aluno USP</option>
                    <option value="prof">Professor USP</option>
                    <option value="funcionario">Funcionário USP</option>
                    <option value="externo">Externo</option>
                </select> 

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="********">

                <button type="submit" class="btn">Entrar</button>
                <p class="error" id="errorMsg">Usuário ou senha incorretos!</p>
                
                <div class="divider">
                <span>ou</span>
                </div>

                <a class=login href="#">Entre na sua conta</a></p>
            </form>
        </section>
    </main>

    <script src="script/signup.js"></script>
</body>
</html>
