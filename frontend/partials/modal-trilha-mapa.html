<div id="trilhaMapModal" class="modal" aria-hidden="true">
  <div class="modal__backdrop" data-close></div>
  <div class="modal__dialog" role="dialog" aria-modal="true">
    <header class="modal__head">
      <h3 id="trilhaMapTitle">Mapa da trilha</h3>
      <button type="button" class="icon-btn" data-close>&times;</button>
    </header>

    <div class="modal__body" style="padding:0;">
      <div id="trilhaMapCanvas" style="width:100%;height:480px;background:#eee"></div>
    </div>

    <footer class="modal__foot">
      <button type="button" class="btn" data-close>Fechar</button>
    </footer>
  </div>
</div>
