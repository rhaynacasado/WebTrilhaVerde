<!-- Modal: Adicionar Pergunta -->
<div id="perguntaAddModal" class="modal" aria-hidden="true">
  <div class="modal__backdrop" data-close></div>
  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="perguntaAddTitle">
    <header class="modal__head">
      <h3 id="perguntaAddTitle">Adicionar pergunta</h3>
      <button class="icon-btn close" title="Fechar" data-close>&times;</button>
    </header>

    <form id="perguntaAddForm" class="form">
      <div class="form__row">
        <label for="addArvore">Árvore *</label>
        <select id="addArvore" required></select>
      </div>

      <div class="form__row">






        
        <label for="addEnunciado">Enunciado *</label>
        <textarea id="addEnunciado" rows="3" placeholder="Digite o enunciado da pergunta..." required></textarea>
      </div>

      <div class="form__row">
        <label for="addTextoInfo">Texto Info *</label>
        <textarea id="addTextoInfo" rows="3" placeholder="Texto explicativo" required></textarea>
      </div>

      <div class="form__grid">
        <div class="form__row">
          <label for="addAudioInfo">Áudio Info (URL) *</label>
          <input id="addAudioInfo" type="url" placeholder="https://..." required />
        </div>
        <div class="form__row">
          <label for="addAudioDica">Áudio Dica (URL) *</label>
          <input id="addAudioDica" type="url" placeholder="https://..." required />
        </div>
      </div>

      <div class="form__grid">
        <div class="form__row">
          <label for="addItemA">Item A *</label>
          <input id="addItemA" type="text" required />
        </div>
        <div class="form__row">
          <label for="addItemB">Item B *</label>
          <input id="addItemB" type="text" required />
        </div>
        <div class="form__row">
          <label for="addItemC">Item C *</label>
          <input id="addItemC" type="text" required />
        </div>
        <div class="form__row">
          <label for="addItemD">Item D *</label>
          <input id="addItemD" type="text" required />
        </div>
        <div class="form__row span-2">
          <label for="addItemE">Item E *</label>
          <input id="addItemE" type="text" required />
        </div>
      </div>

      <div class="form__row">
        <label for="addResposta">Resposta correta *</label>
        <select id="addResposta" required>
          <option value="A">Item A</option>
          <option value="B">Item B</option>
          <option value="C">Item C</option>
          <option value="D">Item D</option>
          <option value="E">Item E</option>
        </select>
      </div>

      <div class="form__row">
        <label for="addTextoDica">Texto Dica *</label>
        <textarea id="addTextoDica" rows="2" placeholder="Texto de dica" required></textarea>
      </div>

      <footer class="modal__foot">
        <button type="button" class="btn" data-close>Cancelar</button>
        <button type="submit" class="btn primary" id="btnAdicionarPergunta">Adicionar</button>
      </footer>
    </form>
  </div>
</div>
