<div id="arvoreModal" class="modal" aria-hidden="true">
  <div class="modal__backdrop" data-close></div>
  <div class="modal__dialog" role="dialog" aria-modal="true">
    <header class="modal__head">
      <h3>Editar árvore</h3>
      <button type="button" class="icon-btn" data-close>&times;</button>
    </header>

    <form id="arvoreForm" class="form">

      <!-- IDENTIFICAÇÃO -->
      <div class="form__grid">
        <div class="form__row">
          <label for="arvoreTrilha">Trilha</label>
          <input id="arvoreTrilha" type="text" readonly aria-readonly="true" class="input-readonly" />
        </div>

        <div class="form__row">
          <label for="arvoreCodigo">Código QRCode</label>
          <input id="arvoreCodigo" type="text" readonly aria-readonly="true" class="input-readonly" />
        </div>
      </div>

      <!-- ORDEM -->
      <div class="form__grid">
        <div class="form__row">
          <label for="arvoreOrdem">Ordem na trilha</label>
          <input
            id="arvoreOrdem"
            type="number"
            min="1"
            placeholder="Sequência da árvore na trilha"
          />
        </div>
      </div>

      <!-- INFORMAÇÕES DA ÁRVORE -->
      <div class="form__grid">
        <div class="form__row">
          <label for="arvoreNome">Nome</label>
          <input id="arvoreNome" type="text" required />
        </div>

        <div class="form__row">
          <label for="arvoreEspecie">Espécie</label>
          <input id="arvoreEspecie" type="text" required />
        </div>
      </div>

      <div class="form__grid">
        <div class="form__row">
          <label for="arvoreFamilia">Família</label>
          <input id="arvoreFamilia" type="text" />
        </div>

        <div class="form__row">
          <label for="arvoreOrigem">Origem</label>
          <input id="arvoreOrigem" type="text" />
        </div>
      </div>

      <div class="form__row">
        <label for="arvoreTipoOrigem">Tipo de origem</label>
        <input
          id="arvoreTipoOrigem"
          type="text"
          placeholder="Ex.: Nativa, Exótica..."
        />
      </div>

      <!-- FOTO -->
      <div class="form__row">
        <label for="arvoreFoto">Foto (URL)</label>
        <input id="arvoreFoto" type="url" placeholder="https://..." />
      </div>

      <!-- POSIÇÃO NO MAPA -->
      <div class="form__grid">
        <div class="form__row">
          <label for="arvoreLatitude">Latitude</label>
          <input
            id="arvoreLatitude"
            type="number"
            step="any"
            placeholder="-22.123456"
          />
        </div>

        <div class="form__row">
          <label for="arvoreLongitude">Longitude</label>
          <input
            id="arvoreLongitude"
            type="number"
            step="any"
            placeholder="-47.123456"
          />
        </div>
      </div>

      <!-- MAPA GOOGLE -->
      <div class="form__row">
        <label>Posição no mapa</label>
        <div id="arvoreMap" style="width:100%;height:320px;border:1px solid #ddd;border-radius:4px"></div>
      </div>

      <!-- pos_x / pos_y removidos -->

      <footer class="modal__foot">
        <button id="btnToggleStatus" type="button" class="btn danger">
          Desativar
        </button>

        <button type="submit" class="btn primary">
          Alterar
        </button>
      </footer>
    </form>
  </div>
</div>
