<!-- Modal: Adicionar Árvore -->
<div id="arvoreAddModal" class="modal" aria-hidden="true">
  <div class="modal__backdrop" data-close></div>

  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="arvoreAddTitle">
    
    <header class="modal__head">
      <h3 id="arvoreAddTitle">Adicionar árvore</h3>
      <button class="icon-btn close" title="Fechar" data-close>&times;</button>
    </header>

    <form id="arvoreAddForm" class="form">

      <!-- DADOS DO PONTO -->
      <div class="form__grid">

        <div class="form__row">
          <label for="addNome">Nome *</label>
          <input
            id="addNome"
            type="text"
            placeholder="Nome"
            required
          />
        </div>

        <div class="form__row">
          <label for="addQrcodeUrl">Link QRCode *</label>
          <input id="addQrcodeUrl" type="url" placeholder="https://..." required />
        </div>

      </div>

      <div class="form__row" data-predio-only>
        <label for="addDescricao">Descrição</label>
        <textarea id="addDescricao" rows="1" placeholder="Ex.: Espaço de extensão universitária voltado à preservação de memória"></textarea>
      </div>

      <div class="form__row" data-predio-only>
        <label for="addConstrucao">Construção</label>
        <textarea id="addConstrucao" rows="1" placeholder="Ex: Construção iniciada em 1904 e inauguração oficial em 14 de maio de 1907"></textarea>
      </div>

      <div class="form__grid">
        <div class="form__row" data-arvore-only>
          <label for="addEspecie">Espécie</label>
          <input
            id="addEspecie"
            type="text"
            placeholder="Ex: Caesalpinia pluviosa"
          />
        </div>

        <div class="form__row" data-arvore-only>
          <label for="addFamilia">Família</label>
          <input
            id="addFamilia"
            type="text"
            placeholder="Ex: Fabaceae"
          />
        </div>
      </div>

      <div class="form__grid">
        <div class="form__row" data-arvore-only>
          <label for="addOrigem">Origem</label>
          <input
            id="addOrigem"
            type="text"
            placeholder="Ex: Brasil"
          />
        </div>

        <div class="form__row" data-arvore-only>
          <label for="addTipoOrigem">Tipo de origem</label>
          <input
            id="addTipoOrigem"
            type="text"
            placeholder="Ex: Nativa, Exótica..."
          />
        </div>
      </div>

      <!-- TRILHAS -->
      <div class="form__row">
        <label for="addTrilhas">Trilhas *</label>
        <div id="addTrilhas" class="trilhas-selecao" role="group" aria-label="Trilhas">
          <!-- opções vêm do backend -->
        </div>
      </div>

      <!-- GALERIA DE FOTOS -->
      <div class="form__row">
        <label>Galeria de fotos</label>
        <div id="addImages">
          <div id="addImagesList"></div>
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
            <input id="addImageUrl" type="url" placeholder="URL da imagem" style="flex:1" />
            <input id="addImageLegenda" type="text" placeholder="Legenda" />
            <input id="addImageFonte" type="text" placeholder="Fonte" />
            <button id="btnAddImageNew" type="button" class="btn">Adicionar</button>
          </div>
        </div>
      </div>

      <!-- COORDENADAS -->
      <div class="form__grid">

        <div class="form__row">
          <label for="addLatitude">Latitude *</label>
          <input
            id="addLatitude"
            type="number"
            step="any"
            placeholder="-22.123456"
            required
          />
        </div>

        <div class="form__row">
          <label for="addLongitude">Longitude *</label>
          <input
            id="addLongitude"
            type="number"
            step="any"
            placeholder="-47.123456"
            required
          />
        </div>

      </div>

      <!-- MAPA GOOGLE -->
      <div class="form__row">
        <label>Posição no mapa</label>
        <div id="arvoreAddMap" style="width:100%;height:320px;border:1px solid #ddd;border-radius:4px"></div>
      </div>

      <!-- pos_x / pos_y removidos -->

      <!-- BOTÕES -->
      <footer class="modal__foot">

        <button
          type="button"
          class="btn"
          data-close
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="btn primary"
          id="btnAdicionarArvore"
        >
          Adicionar
        </button>

      </footer>

    </form>
  </div>
</div>
