<!-- Modal: Adicionar Árvore -->
<div id="arvoreAddModal" class="modal" aria-hidden="true">
  <div class="modal__backdrop" data-close></div>

  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="arvoreAddTitle">
    
    <header class="modal__head">
      <h3 id="arvoreAddTitle">Adicionar árvore</h3>
      <button class="icon-btn close" title="Fechar" data-close>&times;</button>
    </header>

    <form id="arvoreAddForm" class="form">

      <!-- IDENTIFICAÇÃO -->
      <div class="form__grid">

        <div class="form__row">
          <label for="addTrilha">Trilha *</label>
          <select id="addTrilha" required>
            <!-- opções vêm do backend -->
          </select>
        </div>

        <div class="form__row">
          <label for="addCodigo">Código QRCode *</label>
          <input id="addCodigo" type="number" required />
        </div>

      </div>

      <!-- ORDEM -->
      <div class="form__row">
        <label for="addOrdem">Ordem na trilha</label>
        <input
          id="addOrdem"
          type="number"
          min="1"
          placeholder="Sequência da árvore na trilha"
        />
      </div>

      <!-- DADOS DA ÁRVORE -->
      <div class="form__grid">

        <div class="form__row">
          <label for="addNome">Nome *</label>
          <input
            id="addNome"
            type="text"
            placeholder="Nome da árvore"
            required
          />
        </div>

        <div class="form__row">
          <label for="addEspecie">Espécie *</label>
          <input
            id="addEspecie"
            type="text"
            placeholder="Ex: Caesalpinia pluviosa"
            required
          />
        </div>

      </div>

      <div class="form__grid">

        <div class="form__row">
          <label for="addFamilia">Família</label>
          <input
            id="addFamilia"
            type="text"
            placeholder="Ex: Fabaceae"
          />
        </div>

        <div class="form__row">
          <label for="addOrigem">Origem</label>
          <input
            id="addOrigem"
            type="text"
            placeholder="Ex: Brasil"
          />
        </div>

      </div>

      <div class="form__row">
        <label for="addTipoOrigem">Tipo de origem</label>
        <input
          id="addTipoOrigem"
          type="text"
          placeholder="Ex: Nativa, Exótica..."
        />
      </div>

      <!-- FOTO -->
      <div class="form__row">
        <label for="addFoto">Foto (URL)</label>
        <input
          id="addFoto"
          type="url"
          placeholder="https://..."
        />
      </div>

      <!-- COORDENADAS -->
      <div class="form__grid">

        <div class="form__row">
          <label for="addLatitude">Latitude</label>
          <input
            id="addLatitude"
            type="number"
            step="any"
            placeholder="-22.123456"
          />
        </div>

        <div class="form__row">
          <label for="addLongitude">Longitude</label>
          <input
            id="addLongitude"
            type="number"
            step="any"
            placeholder="-47.123456"
          />
        </div>

      </div>

      <!-- MAPA GOOGLE -->
      <div class="form__row">
        <label>Posição no mapa</label>
        <div id="arvoreAddMap" style="width:100%;height:320px;border:1px solid #ddd;border-radius:4px"></div>
      </div>

      <!-- pos_x / pos_y removidos -->

      <!-- BOTÕES -->
      <footer class="modal__foot">

        <button
          type="button"
          class="btn"
          data-close
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="btn primary"
          id="btnAdicionarArvore"
        >
          Adicionar
        </button>

      </footer>

    </form>
  </div>
</div>
