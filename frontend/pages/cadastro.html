<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Trilha Verde</title>
  <link rel="stylesheet" href="../style/acesso.css">
  <link rel="stylesheet" href="../style/cadastro.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body data-page="cadastro">
  <main class="container">
    <div class="left" id="left-container"></div>

    <section class="right">
      <h1 class="logo">Trilha Verde</h1>
      <div class="form-box">
        <h2>Crie uma nova conta</h2>
        <form class="formCadastro">
          <div class="form-content">
            <div class="profile-pic">
              <img id="profileImage" class="profileimage" src="../img/avatar.png" alt="Foto de perfil">
              <label for="fileInput">
                <img class="edit-icon" src="../img/camera.svg" alt="Alterar foto">
              </label>
              <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </div>

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Nome completo">

            <label for="signupEmail">E-mail</label>
            <input type="email" id="signupEmail" placeholder="Seu e-mail">

            <label for="vinculo">Vínculo</label>
            <select id="vinculo" name="vinculo">
              <option value="Aluno USP">Aluno USP</option>
              <option value="Professor USP">Professor USP</option>
              <option value="Funcionário USP">Funcionário USP</option>
              <option value="Externo">Externo</option>
            </select> 

            <label for="signupSenha">Senha</label>
            <input type="password" id="signupSenha" placeholder="********">

            <button type="submit" class="btn">Criar conta</button>
            <p class="error" id="signupError">Cadastro inválido</p>

            <div class="divider"><span>ou</span></div>
            <a class="toggleForm" href="../index.html">Entre na sua conta</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="../script/acesso.js"></script>
  <script src="../script/cadastro.js"></script>
</body>
</html>
