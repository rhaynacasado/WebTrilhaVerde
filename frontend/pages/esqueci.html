<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci a Senha — Trilha Verde</title>
  <link rel="stylesheet" href="../style/acesso.css">
  <link rel="stylesheet" href="../style/redefinicao.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body data-page="esqueci">
  <main class="container">
    <div class="left" id="left-container"></div>

    <section class="right">
      <h1 class="logo">Trilha Verde</h1>
      <div class="form-box">
        <h2>Preencha seu e-mail para redefinir sua senha</h2>
        <form class="formEsqueci">
          <div class="form-content">

            <label for="emailReset">E-mail</label>
            <input type="text" id="emailReset" placeholder="Seu e-mail">

            <button type="submit" class="btn">Enviar redefinição de senha por e-mail</button>

            <div class="divider"><span>ou</span></div>
            <a class="toggleForm" href="../index.html">Retorne à página inicial</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="../script/acesso.js"></script>
  <script src="../script/redefinicao.js"></script>
</body>
</html>
