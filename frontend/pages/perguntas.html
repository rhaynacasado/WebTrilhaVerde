<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perguntas — Trilha Verde</title>
  <link rel="stylesheet" href="../style/admin.css">
  <link rel="stylesheet" href="../style/pergunta.css">
  
</head>
<body>
  <div class="app-shell">
    <div id="sidebar"></div>
    <div id="topbar"></div>

    <main class="content">
      <section class="page visible" id="pagePerguntas">
        <div class="page-header">
          <h2>Perguntas</h2>
          <p>Perguntas sobre as árvores.</p>
        </div>
        
        <div class="filtros-perguntas">
          <div class="filtro-trilha">
            <label for="filtroTrilha">Trilha:</label>
            <select id="filtroTrilha">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="filtro-trilha">
            <label for="filtroArvore">Árvore:</label>
            <select id="filtroArvore">
              <option value="">Todas</option>
            </select>
          </div>
        </div>

        <div class="list" id="perguntasList"></div>
      </section>
    </main>
  </div>

  <script src="../script/env.js"></script>
  <script src="../script/admin.js"></script>
  <script src="../script/pergunta.js"></script>  
</body>
</html>
