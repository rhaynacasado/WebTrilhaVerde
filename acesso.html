<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha Verde - Acesso</title>
  <link rel="stylesheet" href="style/acesso.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <!-- Lado esquerdo -->
    <section class="left">
      <div class="illustration">
        <img src="img/logo.png" alt="Logo Trilha Verde">
        <h2>Trilha Verde</h2>
        <p>Página de Administração</p>
      </div>
    </section>

    <!-- Lado direito -->
    <section class="right">
      <h1 class="logo">Trilha Verde</h1>

      <!-- Formulário de Login -->
      <div id="loginForm" class="form-box active">
        <h2>Entre com sua conta</h2>
        <form class="formLogin">
          <label for="loginEmail">E-mail</label>
          <input type="text" id="loginEmail" placeholder="Seu e-mail">

          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" placeholder="********">

          <div class="forgotpass">
            <a href="#">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="btn">Entrar</button>
          <p class="error" id="loginError">Usuário ou senha incorretos!</p>

          <div class="divider"><span>ou</span></div>
          <a class="toggleForm" href="#" id="toSignup">Criar nova conta</a>
        </form>
      </div>

      <!-- Formulário de Cadastro -->
      <div id="signupForm" class="form-box">
        <h2>Crie uma nova conta</h2>
        <form class="formCadastro">
          <div class="form-content">
            <div class="profile-pic">
              <img id="profileImage" src="img/avatar.png" alt="Foto de perfil">
              <label for="fileInput" class="edit-icon">✏️</label>
              <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </div>

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Nome completo">

            <label for="signupEmail">E-mail</label>
            <input type="email" id="signupEmail" placeholder="Seu e-mail">

            <label for="vinculo">Vínculo</label>
            <select id="vinculo">
              <option value="aluno">Aluno USP</option>
              <option value="prof">Professor USP</option>
              <option value="funcionario">Funcionário USP</option>
              <option value="externo">Externo</option>
            </select> 

            <label for="signupSenha">Senha</label>
            <input type="password" id="signupSenha" placeholder="********">

            <button type="submit" class="btn">Criar conta</button>
            <p class="error" id="signupError">Cadastro inválido</p>

            <div class="divider"><span>ou</span></div>
            <a class="toggleForm" href="#" id="toLogin">Entre na sua conta</a>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script src="script/acesso.js"></script>
</body>
</html>
