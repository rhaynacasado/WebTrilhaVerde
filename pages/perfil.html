<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perfil — Trilha Verde</title>
  <link rel="stylesheet" href="../style/admin.css" />
  <link rel="stylesheet" href="../style/perfil.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar"></div>
    <div id="topbar"></div>

    <main class="content">
      <section class="page visible" id="pagePerfil">
        <div class="page-header">
          <h2>Meu Perfil</h2>
          <p>Gerencie suas informações pessoais.</p>
        </div>
        <div class="profile-card">
          <div class="profile-pic">
          <img id="profile-pic" alt="Foto de perfil do usuário" />
          <button class="edit-photo">Alterar foto</button>
          <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>

          <div class="profile-info">
            <h3 id="profileNome"></h3>
            <p id="profileEmail"></p>

            <div class="profile-fields">
              <label>
                Nome completo
                <input type="text" id="inputNome"/>
              </label>
              <label>
                E-mail
                <input type="email" id="inputEmail"/>
              </label>
              <label>
                Vínculo
                <select id="inputVinculo">
                  <option value="aluno">Aluno USP</option>
                  <option value="prof">Professor USP</option>
                  <option value="funcionario">Funcionário USP</option>
                  <option value="externo">Externo</option>
                </select> 
              </label>
            </div>

            <div class="profile-actions">
              <button class="primary">Salvar alterações</button>
              <button class="ghost">Cancelar</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../script/admin.js"></script>
  <script src="../script/perfil.js"></script>
</body>
</html>
